<!-- Ejercicio 2 — Listas y enlaces
Crear una página con una lista ordenada de 5 pasos (receta o instructivo) y una lista no ordenada con al menos un enlace externo (<a href> con target="_blank").
Requisitos: <ol>, <ul>, <li>, <a>.
Evaluación: Anidamiento correcto y uso de atributos de enlace. -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listas y enlaces</title>
</head>

<body>
  <h1>Receta de café instantáneo (lista ordenada)</h1>

  <ol>
    <li>Hervir agua en una pava</li>
    <li>Colocar una cucharada de café en una taza</li>
    <li>Agregar agua caliente a la taza</li>
    <li>Revolver bien con una cuchara</li>
    <li>Agrega azúcar a gusto</li>
  </ol>

  <h1>Lista desordenada</h1>
  
  <ul>
    <li>
      <a href="https://www.google.com" target="_blank">Buscar más recetas online</a>
    </li>
    <!-- target="_blank" lo abre en otra ventana-->
  </ul>

</body>

</html>
