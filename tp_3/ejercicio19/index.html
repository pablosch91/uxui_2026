<!-- Ejercicio 19 — Formulario multi-step con validación visual
Maquetar un formulario de registro en 2 "pasos" (usando solo HTML/CSS, mostrando/ocultando secciones con el truco de :target o radio buttons), con estilos de error usando :invalid y :valid.
Requisitos: Pseudo-clases de validación de formularios (:invalid, :valid, :required), feedback visual (bordes rojos/verdes).
Evaluación: Correcta implementación de validación nativa y transición entre pasos. -->

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 19 - Formulario en 2 pasos</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Registro</h1>

  <form class="registro" action="" method="POST">

    <!-- Radios ocultos: guardan el paso actual. Deben ir ANTES de las secciones para que ~ funcione -->
    <input type="radio" name="paso" id="paso1" class="paso-radio" checked>
    <input type="radio" name="paso" id="paso2" class="paso-radio">

    <!-- Indicador de progreso -->
    <div class="indicador">
      <span class="ind-1">1. Datos personales</span>
      <span class="ind-2">2. Cuenta</span>
    </div>

    <!-- PASO 1 -->
    <fieldset class="paso paso-1">
      <legend>Paso 1: Datos personales</legend>

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ej: Ana Pérez" required minlength="3">
      <span class="error">Escribí al menos 3 caracteres.</span>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="ana@correo.com" required>
      <span class="error">Ingresá un correo válido (con @).</span>

      <label for="paso2" class="btn btn-siguiente">Siguiente →</label>
    </fieldset>

    <!-- PASO 2 -->
    <fieldset class="paso paso-2">
      <legend>Paso 2: Cuenta</legend>

      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" placeholder="Ej: ana123" required minlength="4">
      <span class="error">El usuario necesita al menos 4 caracteres.</span>

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" placeholder="Mínimo 8 caracteres" required minlength="8">
      <span class="error">La contraseña necesita al menos 8 caracteres.</span>

      <label for="paso1" class="btn btn-atras">← Atrás</label>
      <button type="submit" class="btn">Registrarme</button>
    </fieldset>

  </form>

</body>

</html>
