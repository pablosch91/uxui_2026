<!-- Ejercicio 18 — Grid avanzado: galería tipo mosaico (Masonry-like)
Crear una galería de imágenes de tamaños desiguales usando grid-template-columns: repeat(auto-fill, minmax(...)) y grid-auto-flow: dense.
Requisitos: Al menos un elemento que ocupe 2 columnas y 2 fi las (grid-column/grid-row: span).
Evaluación: Distribución armónica sin espacios vacíos evidentes. -->

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 18 - Galería mosaico</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Galería mosaico</h1>

  <div class="galeria">
    <img class="grande" src="https://picsum.photos/seed/uno/600/600" alt="Foto 1">
    <img src="https://picsum.photos/seed/dos/600/600" alt="Foto 2">
    <img class="ancha" src="https://picsum.photos/seed/tres/600/600" alt="Foto 3">
    <img src="https://picsum.photos/seed/cuatro/600/600" alt="Foto 4">
    <img class="alta" src="https://picsum.photos/seed/cinco/600/600" alt="Foto 5">
    <img src="https://picsum.photos/seed/seis/600/600" alt="Foto 6">
    <img src="https://picsum.photos/seed/siete/600/600" alt="Foto 7">
    <img class="ancha" src="https://picsum.photos/seed/ocho/600/600" alt="Foto 8">
    <img src="https://picsum.photos/seed/nueve/600/600" alt="Foto 9">
    <img class="grande" src="https://picsum.photos/seed/diez/600/600" alt="Foto 10">
    <img src="https://picsum.photos/seed/once/600/600" alt="Foto 11">
    <img src="https://picsum.photos/seed/doce/600/600" alt="Foto 12">
  </div>

</body>

</html>
