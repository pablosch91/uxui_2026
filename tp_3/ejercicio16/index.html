<!-- Ejercicio 16 — Animaciones con @keyframes
Crear una animación de carga (spinner) o de aparición de una tarjeta (fade-in + slide-up) usando @keyframes y animation.
Requisitos: Control de duration, timing-function y iteration-count.
Evaluación: Fluidez de la animación y uso correcto de la sintaxis de keyframes. -->

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animaciones</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Animaciones con @keyframes</h1>

  <!-- Spinner de carga -->
  <h2>Spinner</h2>
  <div class="spinner"></div>

  <!-- Tarjeta con fade-in + slide-up -->
  <h2>Tarjeta</h2>
  <div class="tarjeta">
    <h3>Título de la tarjeta</h3>
    <p>Esta tarjeta aparece con un desvanecimiento y sube desde abajo.</p>
  </div>

</body>

</html>
