<!-- Ejercicio 5 — Primeros estilos CSS
Aplicar un archivo CSS externo a la página del Ejercicio 1: cambiar tipografía, color de fondo, color de texto y tamaño de fuente del <h1>.
Requisitos: Vínculo <link> a hoja de estilos externa, selectores de etiqueta.
Evaluación: Correcta vinculación y uso de propiedades básicas (color, background-color, font-family, font-size). -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css"> <!-- etiqueta especial solamente de apertura , vincula o referencia este archivo con el css -->
  <title>Document</title>
</head>

<body>
  <h1>soy un encabezado</h1>
  <p>soy un párrafo</p>
  <!-- Si la imagen no aparece, el alt muestra un texto que la describe -->
  <img src="https://picsum.photos/200/300" alt="Imagenes random">
</body>

</html>
