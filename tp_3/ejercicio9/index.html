<!-- Ejercicio 9 — Flexbox: galería de tarjetas
Maquetar una galería de 6 tarjetas de producto (imagen, título, precio, botón) que se reordenen automáticamente con flex-wrap.
Requisitos: flex-wrap: wrap, gap, tamaños flexibles con flex-basis o flex-grow.
Evaluación: Comportamiento responsivo básico al cambiar el ancho de ventana. -->

<!DOCTYPE HTML>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Tarjetas de producto</title>
</head>

<body>

  <section class="galeria">
    <article class="tarjeta">
      <img src="logo.png" alt="Producto">
      <h2>Producto 1</h2>
      <p class="precio">$10.000</p>
      <button>Comprar</button>
    </article>

    <article class="tarjeta">
      <img src="logo.png" alt="Producto">
      <h2>Producto 2</h2>
      <p class="precio">$15.000</p>
      <button>Comprar</button>
    </article>

    <article class="tarjeta">
      <img src="logo.png" alt="Producto">
      <h2>Producto 3</h2>
      <p class="precio">$20.000</p>
      <button>Comprar</button>
    </article>

    <article class="tarjeta">
      <img src="logo.png" alt="Producto">
      <h2>Producto 4</h2>
      <p class="precio">$12.000</p>
      <button>Comprar</button>
    </article>

    <article class="tarjeta">
      <img src="logo.png" alt="Producto">
      <h2>Producto 5</h2>
      <p class="precio">$18.000</p>
      <button>Comprar</button>
    </article>

    <article class="tarjeta">
      <img src="logo.png" alt="Producto">
      <h2>Producto 6</h2>
      <p class="precio">$25.000</p>
      <button>Comprar</button>
    </article>
  </section>

</body>

</html>
