<!-- Ejercicio 1 — Estructura HTML básica
Crear un documento HTML5 válido con <!DOCTYPE html>, <head> (con <title> y <meta charset>) y <body> con un encabezado <h1>, un párrafo <p> y una imagen <img> con atributo alt.
Requisitos: Etiquetas semánticas correctas, imagen con texto alternativo.
Evaluación: Validez del documento y uso correcto de etiquetas. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>soy un encabezado</h1>
  <p>soy un párrafo</p>
  <!-- Si la imagen no aparece, el alt muestra un texto que la describe -->
  <img src="https://picsum.photos/200/300" alt="Imagenes random">
</body>
</html>
