<!-- Ejercicio 7 — Modelo de caja (Box Model)
Crear tres tarjetas (<div class="card">) en fila y aplicar margin, padding, border y box-sizing: border-box para que tengan el mismo tamaño visual.
Requisitos: Uso explícito de box-sizing.
Evaluación: Comprensión del modelo de caja y consistencia visual. -->

<!DOCTYPE html>
<html lang="es">

<head>

  <link rel="stylesheet" href="styles.css">
  <title>Modelo de Caja</title>
</head>

<body>

  <h1>Modelo de Caja</h1>

  <div class="contenedor">
    <div class="card">
      <h2>Tarjeta 1</h2>
      <p>Contenido de la primera tarjeta.</p>
    </div>

    <div class="card">
      <h2>Tarjeta 2</h2>
      <p>Contenido de la segunda tarjeta.</p>
    </div>

    <div class="card">
      <h2>Tarjeta 3</h2>
      <p>Contenido de la tercera tarjeta.</p>
    </div>
  </div>

</body>

</html>
