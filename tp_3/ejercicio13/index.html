<!-- Ejercicio 13 — Formulario estilizado
Retomar el formulario del Ejercicio 4 y aplicarle estilos: inputs con bordes redondeados, estados :focus diferenciados, botón con estado :hover y :active.
Requisitos: Transiciones suaves (transition) en los cambios de estado.
Evaluación: Coherencia visual y feedback interactivo. -->

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contacto</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1>Contacto</h1>

  <form action="" method="POST"> <!-- Etiqueta para construir el formulario, método POST envía la información -->

    <!-- Para cada campo vamos a utilizar una etiqueta que se llama label -->

    <!-- Nombre -->
    <div>
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>
    <br>

    <!-- Email -->
    <div>
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required>
    </div>
    <br>

    <!-- Mensaje -->
    <div>
      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="5" cols="30" required></textarea>
    </div>
    <br>

    <!-- Botón de Envío -->
    <button type="submit">Enviar mensaje</button>

  </form>

</body>

</html>
